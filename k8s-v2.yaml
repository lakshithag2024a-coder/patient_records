apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-records-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-records
      version: v2
  template:
    metadata:
      labels:
        app: patient-records
        version: v2
    spec:
      containers:
      - name: patient-app
        image: lakshitha119/patient-records:v2
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: patient-records-v2-svc
spec:
  type: NodePort
  selector:
    app: patient-records
    version: v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30002