apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-records-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-records
      version: v1
  template:
    metadata:
      labels:
        app: patient-records
        version: v1
    spec:
      containers:
      - name: patient-app
        image: yourdockerhubusername/patient-records:v1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: patient-records-v1-svc
spec:
  type: NodePort
  selector:
    app: patient-records
    version: v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001